---
- name: Install LAMP stack and WordPress on Debian 12
  hosts: debian-web
  become: true
  vars:
    wp_db_name: wordpress
    wp_db_user: wpuser
    wp_db_password: "12345678"
    wp_version: "6.4.3"   
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install LAMP packages
      apt:
        name:
          - apache2
          - mariadb-server
          - php
          - libapache2-mod-php
          - php-mysql
          - php-xml
          - php-mbstring
          - php-curl
          - php-zip
          - php-gd
          - unzip
          - wget
          - python3-pymysql  
        state: present

    - name: Ensure Apache and MariaDB are running
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - apache2
        - mariadb

    - name: Create WordPress database
      mysql_db:
        name: "{{ wp_db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create WordPress database user
      mysql_user:
        name: "{{ wp_db_user }}"
        password: "{{ wp_db_password }}"
        priv: "{{ wp_db_name }}.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Download WordPress
      get_url:
        url: "https://wordpress.org/wordpress-{{ wp_version }}.tar.gz"
        dest: /tmp/wordpress.tar.gz

    - name: Extract WordPress to web root
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /var/www/html/
        remote_src: yes

    - name: Set permissions on WordPress directory
      file:
        path: /var/www/html/wordpress
        owner: www-data
        group: www-data
        recurse: yes

    - name: Create wp-config.php from sample
      copy:
        src: /var/www/html/wordpress/wp-config-sample.php
        dest: /var/www/html/wordpress/wp-config.php
        remote_src: yes
        owner: www-data
        group: www-data

    - name: Configure database credentials in wp-config.php
      lineinfile:
        path: /var/www/html/wordpress/wp-config.php
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: "database_name_here", line: "define('DB_NAME', '{{ wp_db_name }}');" }
        - { regexp: "username_here", line: "define('DB_USER', '{{ wp_db_user }}');" }
        - { regexp: "password_here", line: "define('DB_PASSWORD', '{{ wp_db_password }}');" }

    - name: Enable Apache rewrite module
      apache2_module:
        name: rewrite
        state: present

    - name: Remove default Apache site, add WordPress site
      copy:
        dest: /etc/apache2/sites-available/wordpress.conf
        content: |
          <VirtualHost *:80>
              DocumentRoot /var/www/html/wordpress
              <Directory /var/www/html/wordpress>
                  Options FollowSymLinks
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>

    - name: Disable default site
      command: a2dissite 000-default.conf
      notify: reload apache

    - name: Enable WordPress site
      command: a2ensite wordpress.conf
      notify: reload apache

  handlers:
    - name: reload apache
      service:
        name: apache2
        state: reloaded
