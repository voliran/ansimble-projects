---
- name: Установить PHP и модули
  apt:
    name:
      - php
      - libapache2-mod-php
      - php-mysql
      - php-xml
      - php-mbstring
      - php-curl
      - php-zip
      - php-gd
    state: present

- name: Перезапустить Apache после установки PHP
  service:
    name: apache2
    state: restarted
